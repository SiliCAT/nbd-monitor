# NBD client configuration template; set a unique client_id before use.
[global]
client_id = CHANGE_ME
control_port = 10921
heartbeat_interval_sec = 10
request_timeout_sec = 2
startup_report_timeout_sec = 5

detach_enabled = no
detach_attempts = 3
detach_interval_sec = 10

