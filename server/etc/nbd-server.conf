# NBD server configuration template; define resources before enabling listeners.
[global]
register_timeout_sec = 30
heartbeat_timeout_sec = 30
closing_timeout_sec = 45
maintenance_timeout_sec = 120
reset_on_timeout = no
write_mode = keep
read_only = no
snapshot_keep = 0

